spring:
  application:
    name: coinpath
  profiles:
    active: dev

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:-SYSTEM}] [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: c2VjdXJlLWNvaW5wYXRoLWp3dC1zZWNyZXQta2V5LTM1NjgyOTM4NDc1OTIwMTkzODQ3NTkyMDE5Mzg0NzU=
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
  kafka:
    topics:
      payment-events: coinpath.payment.events
      transfer-events: coinpath.transfer.events
      refund-events: coinpath.refund.events
    consumer:
      notification-group: coinpath-notification-group
      audit-group: coinpath-audit-group
  outbox:
    polling-interval-ms: 2000
    batch-size: 50
